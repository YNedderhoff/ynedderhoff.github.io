name: Check and generate Preview

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HTML5Validator
        uses: Cyb3r-Jak3/html5validator-action@v8.0.0
        with:
          root: .
          # Plain-text Search Console verification file, not HTML.
          blacklist: 'google3a4a0a6e7026b0de.html'
          # The bundled CSS validator does not know modern CSS (margin-inline, text-wrap, light-dark()).
          css: false
      - name: Generate HTML preview
        id: html_preview
        uses: pavi2410/html-preview-action@v4
        with:
          html_file: 'index.html'
